schema_version: 1
model:
  family: forecast
  name: multihead-lstm
  parameters:
    hidden_dim: 32
    num_layers: 2
    dropout: 0.0
    num_heads: 4
    sinkhorn_iterations: 20
observability:
  probes:
    - name: mixer-state
      every_n_epochs: 1
      include_grad_norms: true
    - name: activation-stats
      points:
        - {path: "mixer", quantity: "mixing-displacement"}
      every_n_epochs: 1
